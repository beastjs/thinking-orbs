name: Publish to npm

# Publishes the package on every git tag matching v* (e.g. v0.1.0, v1.0.0).
# `--provenance` requires `id-token: write` and a registry-url with HTTPS,
# and produces an attestation linking the tarball to this workflow run.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Source-only package: nothing to install or build. --access public is
      # required for scoped packages. ORBS must be a Granular Access token
      # with publish rights to the @beastjs org.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ORBS }}
